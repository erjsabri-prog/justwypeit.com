<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout · wype® Marketplace</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/wype-w-badge.png">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Audiowide&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/mp.css">
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    .co { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 30px; padding: 26px 0 40px; align-items: start; }
    @media (max-width: 900px) { .co { grid-template-columns: 1fr; } .co .summary { order: -1; } }
    .co h1 { font-size: 30px; margin-bottom: 16px; }
    .co h2 { font-size: 19px; margin: 22px 0 12px; display: flex; align-items: center; gap: 10px; }
    .co h2 i { width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: #fff; font-style: normal; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
    .summary { position: sticky; top: 120px; }
    .summary .item { display: flex; gap: 12px; align-items: center; }
    .summary .item img { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; background: var(--bg-2); }
    .summary .item b { font-size: 14px; display: block; line-height: 1.3; }
    .summary .rows { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 8px; font-size: 14px; }
    .summary .rows div { display: flex; justify-content: space-between; }
    .summary .rows .tot { font-family: var(--font-head); font-size: 22px; font-weight: 700; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
    .summary .guard { margin-top: 14px; background: var(--bg-2); border-radius: 10px; padding: 12px 14px; font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
    #payment-element { margin-top: 6px; }
    .pay-err { color: #c0392b; font-size: 13.5px; margin-top: 10px; display: none; }
    .done { max-width: 640px; margin: 50px auto; text-align: center; }
    .done .tick { width: 70px; height: 70px; border-radius: 50%; background: var(--green); color: #fff; font-size: 34px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px; }
    .done h1 { font-size: 34px; }
    .done .box { text-align: left; margin-top: 24px; }
  </style>
</head>
<body>
  <header id="mpHeader"></header>
  <main class="mp-main"><div class="mp-wrap" id="page"><div class="skel" style="height:300px;margin-top:26px"></div></div></main>
  <footer id="mpFooter"></footer>

  <script src="/mp.js"></script>
  <script>
    MP.renderHeader({ cats: false }); MP.renderFooter();
    var page = document.getElementById('page');
    var listingId = MP.qs('listing'), qty = Math.max(1, parseInt(MP.qs('qty'), 10) || 1);
    var piFromReturn = MP.qs('payment_intent');

    if (piFromReturn) { showConfirmation(piFromReturn); }
    else if (!listingId) { page.innerHTML = '<div class="empty" style="padding:80px 0"><strong>Nothing to check out</strong><a href="/marketplace" class="btn btn--dark btn--sm" style="margin-top:14px">Browse the marketplace</a></div>'; }
    else { startCheckout(); }

    var _stripe, _elements, _clientSecret, _piId, L, Q;

    async function startCheckout() {
      try {
        var d = await MP.api('/api/mp/listings/' + encodeURIComponent(listingId), { auth: false });
        L = d.listing;
        if (L.available < qty) qty = Math.max(1, L.available);
        if (L.available <= 0) { page.innerHTML = '<div class="empty" style="padding:80px 0"><strong>Sold out</strong>This item has just sold out.<br><br><a href="/marketplace" class="btn btn--dark btn--sm">Keep browsing</a></div>'; return; }
        var intent = await MP.api('/api/mp/checkout/intent', { method: 'POST', auth: false, body: { listingId: L.id, qty: qty, reuseIntentId: sessionStorage.getItem('mp_pi') || undefined } });
        Q = intent.quote; qty = intent.qty; _clientSecret = intent.clientSecret; _piId = intent.paymentIntentId;
        sessionStorage.setItem('mp_pi', _piId);
        renderForm();
        await mountStripe();
      } catch (e) {
        page.innerHTML = '<div class="empty" style="padding:80px 0"><strong>Couldn’t start checkout</strong>' + MP.esc(e.message) + '<br><br><a href="/marketplace" class="btn btn--dark btn--sm">Back to marketplace</a></div>';
      }
    }

    function renderForm() {
      var u = MP.user() || {};
      page.innerHTML = '<div class="co"><div>' +
        '<h1>Checkout</h1>' +
        '<form id="coForm" onsubmit="return pay(event)">' +
          '<h2><i>1</i> Contact</h2>' +
          '<div class="field-row"><div class="field"><label>First name</label><input id="firstName" required autocomplete="given-name" value="' + MP.esc(u.firstName || '') + '"></div><div class="field"><label>Last name</label><input id="lastName" required autocomplete="family-name" value="' + MP.esc(u.lastName || '') + '"></div></div>' +
          '<div class="field-row"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email" value="' + MP.esc(u.email || '') + '"><div class="hint">Order confirmation and tracking go here.</div></div><div class="field"><label>Phone <small>(for the courier)</small></label><input id="phone" type="tel" autocomplete="tel"></div></div>' +
          '<h2><i>2</i> Delivery address</h2>' +
          '<div class="field"><label>Address line 1</label><input id="address1" required autocomplete="address-line1"></div>' +
          '<div class="field"><label>Address line 2 <small>(optional)</small></label><input id="address2" autocomplete="address-line2"></div>' +
          '<div class="field-row--3 field-row"><div class="field"><label>Town / city</label><input id="city" required autocomplete="address-level2"></div><div class="field"><label>Postcode</label><input id="postcode" required autocomplete="postal-code" style="text-transform:uppercase"></div><div class="field"><label>Country</label><select id="country">' + countryOptions() + '</select></div></div>' +
          '<div class="field"><label>Note to seller <small>(optional)</small></label><input id="note" maxlength="300" placeholder="Leave with neighbour, colour preference…"></div>' +
          '<h2><i>3</i> Payment</h2>' +
          '<div id="payment-element"><div class="skel" style="height:180px"></div></div>' +
          '<div class="pay-err" id="payErr"></div>' +
          '<button type="submit" class="btn btn--primary btn--block" id="payBtn" style="margin-top:18px;font-size:16px;padding:15px" disabled>Pay ' + MP.money(Q.total) + '</button>' +
          '<p class="small muted" style="text-align:center;margin-top:10px">Payments processed by Stripe on behalf of wype®. By paying you agree to the <a href="/terms.html" style="text-decoration:underline">marketplace terms</a>.</p>' +
        '</form>' +
      '</div>' +
      '<div class="summary card">' +
        '<div class="item"><img src="' + (L.image || MP.placeholder) + '" alt=""><div><b>' + MP.esc(L.title) + '</b><span class="small muted">Qty ' + qty + ' · Sold by ' + MP.esc(L.seller.shopName) + '</span></div></div>' +
        '<div class="rows"><div><span>Item' + (qty > 1 ? 's (' + qty + ' × ' + MP.money(Q.unit) + ')' : '') + '</span><span>' + MP.money(Q.itemTotal) + '</span></div><div><span>Postage</span><span>' + (Q.shipping > 0 ? MP.money(Q.shipping) : 'Free') + '</span></div><div class="tot"><span>Total</span><span>' + MP.money(Q.total) + '</span></div></div>' +
        '<div class="guard">🛡 <b>wype® buyer protection.</b> Your money is held by wype® and only released to the seller after the parcel shows delivered and you confirm you’re happy. Not as described? We refund you.</div>' +
      '</div></div>';
    }

    function countryOptions() {
      var c = [['GB', 'United Kingdom'], ['IE', 'Ireland'], ['DE', 'Germany'], ['FR', 'France'], ['NL', 'Netherlands'], ['BE', 'Belgium'], ['ES', 'Spain'], ['IT', 'Italy'], ['US', 'United States'], ['AU', 'Australia']];
      if (L.shipsTo === 'UK') c = c.slice(0, 1);
      else if (L.shipsTo === 'UK_EU') c = c.slice(0, 8);
      return c.map(function (x) { return '<option value="' + x[0] + '">' + x[1] + '</option>'; }).join('');
    }

    async function mountStripe() {
      var cfg = await fetch('/stripe-config').then(function (r) { return r.json(); });
      _stripe = Stripe(cfg.publishableKey);
      _elements = _stripe.elements({ clientSecret: _clientSecret, locale: 'en-GB', appearance: { theme: 'stripe', variables: { colorPrimary: '#111111', borderRadius: '9px', fontFamily: 'Inter, system-ui, sans-serif' } } });
      var pe = _elements.create('payment', { layout: 'tabs', wallets: { applePay: 'auto', googlePay: 'auto' } });
      pe.mount('#payment-element');
      pe.on('ready', function () { document.getElementById('payBtn').disabled = false; });
    }

    function val(id) { return (document.getElementById(id).value || '').trim(); }

    async function pay(e) {
      e.preventDefault();
      var btn = document.getElementById('payBtn'), err = document.getElementById('payErr');
      btn.disabled = true; btn.textContent = 'Processing…'; err.style.display = 'none';
      try {
        var s = await _elements.submit(); if (s.error) throw s.error;
        await MP.api('/api/mp/checkout/register-pending', { method: 'POST', body: {
          paymentIntentId: _piId, listingId: L.id, qty: qty,
          firstName: val('firstName'), lastName: val('lastName'), email: val('email').toLowerCase(), phone: val('phone'),
          address1: val('address1'), address2: val('address2'), city: val('city'), postcode: val('postcode').toUpperCase(), country: val('country'), note: val('note'),
        } });
        var r = await _stripe.confirmPayment({ elements: _elements, clientSecret: _clientSecret, confirmParams: {
          return_url: location.origin + '/marketplace/checkout',
          receipt_email: val('email'),
          shipping: { name: val('firstName') + ' ' + val('lastName'), phone: val('phone') || undefined, address: { line1: val('address1'), line2: val('address2') || undefined, city: val('city'), postal_code: val('postcode'), country: val('country') } },
        } });
        if (r.error) throw r.error;
      } catch (ex) {
        err.textContent = ex.message || 'Payment failed. Please try again.'; err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Pay ' + MP.money(Q.total);
      }
    }

    async function showConfirmation(pi, attempt) {
      attempt = attempt || 0;
      sessionStorage.removeItem('mp_pi');
      if (MP.qs('redirect_status') === 'failed') { page.innerHTML = '<div class="empty" style="padding:80px 0"><strong>Payment didn’t go through</strong>No money was taken. <a href="javascript:history.back()" style="text-decoration:underline">Try again</a>.</div>'; return; }
      try {
        var r = await fetch('/api/mp/order-by-intent?pi=' + encodeURIComponent(pi));
        if (r.status === 202 && attempt < 8) { page.innerHTML = '<div class="empty" style="padding:80px 0"><strong>Confirming your payment…</strong>This takes a few seconds.</div>'; return setTimeout(function () { showConfirmation(pi, attempt + 1); }, 1500); }
        var d = await r.json(); if (!r.ok) throw new Error(d.error || 'Could not load order');
        var o = d.order;
        page.innerHTML = '<div class="done"><div class="tick">✓</div><h1>Order confirmed!</h1><p class="muted">Order <b class="mono">' + o.orderNumber + '</b> · a confirmation has been emailed to ' + MP.esc(o.email || 'you') + '.</p>' +
          '<div class="card box"><div style="display:flex;gap:12px;align-items:center"><img src="' + (o.image || MP.placeholder) + '" style="width:64px;height:64px;border-radius:10px;object-fit:cover"><div><b>' + MP.esc(o.title) + '</b><br><span class="small muted">Qty ' + o.qty + ' · ' + MP.money(o.total) + ' paid</span></div></div>' +
          '<p class="small" style="margin-top:14px"><b>What happens next:</b> the seller dispatches your order and uploads tracking — you’ll get an email. When it arrives, confirm you’re happy from your order page so the seller gets paid.</p>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><a href="/marketplace/order?order=' + encodeURIComponent(o.orderNumber) + '&email=' + encodeURIComponent(o.email || '') + '" class="btn btn--dark btn--sm">View order</a><a href="/marketplace" class="btn btn--ghost btn--sm">Keep browsing</a></div></div></div>';
      } catch (e) {
        page.innerHTML = '<div class="empty" style="padding:80px 0"><strong>Payment received</strong>We’re finalising your order — check your email in a few minutes, or contact customer@justwypeit.com quoting ' + MP.esc(pi) + '.</div>';
      }
    }
  </script>
</body>
</html>
